# A Hyprland to run inside a wlterm pane:
#
#   ./wlterm -- Hyprland -c nested.conf
#
# Its own config on purpose. The real one starts a bar, a notification
# daemon and a wallpaper daemon, and binds keys that belong to the host
# session.
#
# Every bind is on SUPER, because a terminal inside the pane wants ctrl and
# alt for itself.

monitor = , preferred, auto, 1

exec-once = foot

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# SUPER+D opens rofi. Install rofi-wayland: plain rofi is an X11 program and
# there is no X server in here.
bind = SUPER, D, exec, rofi -show drun
bind = SUPER, RETURN, exec, foot
bind = SUPER, Q, killactive
bind = SUPER, TAB, cyclenext
bind = SUPER, TAB, bringactivetotop
bind = SUPER, J, cyclenext
bind = SUPER, K, cyclenext, prev
bind = SUPER, F, fullscreen, 1
bind = SUPER SHIFT, Q, exit
