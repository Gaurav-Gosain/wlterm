# A Hyprland to run inside a wlterm pane. Its own config on purpose: the
# real one starts a bar, a notification daemon and a wallpaper daemon, and
# binds keys that belong to the host session.
monitor = , preferred, auto, 1
exec-once = foot
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
